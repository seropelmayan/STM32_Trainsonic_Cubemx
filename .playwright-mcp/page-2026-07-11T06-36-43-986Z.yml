              - link "" [ref=f7e484] [cursor=pointer]:
                - /url: "#resources"
            - list [ref=f7e485]:
              - listitem [ref=f7e486]:
                - paragraph [ref=f7e487]:
                  - text: To help find optimal magnetic encoder mounting for non-standard magnets, use
                  - link "Monolithic Power’s “Magnetic Simulation Tool”" [ref=f7e488] [cursor=pointer]:
                    - /url: https://sensors.monolithicpower.com/
                  - text: . The magnetic angle sensor used on the ODrive S1, Micro, Pro, and OA1 is the MA702.
